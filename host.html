<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>En una nota — Anfitrión</title>
<style>
  :root{
    --bg:#0b0d17;
    --panel:#151a2e;
    --panel2:#1c2340;
    --accent:#ffcc00;
    --green:#22c55e;
    --red:#ef4444;
    --text:#f5f6fa;
    --muted:#9aa0b4;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px 60px;
  }
  h1{ margin:0 0 4px; font-size:1.6rem; }
  .sub{ color:var(--muted); margin:0 0 24px; }
  .layout{
    width:100%;
    max-width:1000px;
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:24px;
  }
  @media (max-width: 800px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel);
    border-radius:18px;
    padding:22px;
  }
  .panel h2{ margin:0 0 14px; font-size:1.05rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }

  /* Conexión */
  .join-box{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  #qr{ width:132px; height:132px; border-radius:12px; background:#fff; padding:8px; }
  .link-info{ flex:1; min-width:200px; }
  .link-url{
    font-size:1.15rem;
    font-weight:700;
    color:var(--accent);
    word-break:break-all;
  }
  .link-hint{ color:var(--muted); font-size:.85rem; margin-top:4px; }

  /* Estado / control de ronda */
  .state-box{ text-align:center; padding:10px 0 4px; }
  .state-label{ font-size:.9rem; color:var(--muted); margin-bottom:10px; }
  .winner-banner{
    font-size:2.2rem;
    font-weight:900;
    color:var(--red);
    margin:6px 0 18px;
    min-height:2.6rem;
  }
  .btn{
    font: inherit;
    cursor:pointer;
    border:none;
    border-radius:14px;
    padding:16px 20px;
    font-weight:700;
    font-size:1.05rem;
    width:100%;
    margin-top:10px;
  }
  .btn-arm{ background:var(--green); color:#06210f; }
  .btn-award{ background:var(--accent); color:#241d00; }
  .btn-reset{
    background:#f59e0b; color:#241a00; border:none;
    font-size:1.2rem; padding:20px;
  }
  .btn-reset.urgent{
    animation: pulse-reset 1s infinite;
  }
  @keyframes pulse-reset{
    0%,100%{ box-shadow:0 0 0 0 rgba(245,158,11,.55); }
    50%{ box-shadow:0 0 0 10px rgba(245,158,11,0); }
  }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn:active:not(:disabled){ transform:scale(.99); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ margin-top:10px; }

  /* Marcador */
  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:10px 8px; border-bottom:1px solid #262c4a; }
  th{ color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; font-weight:600; }
  td.score{ font-weight:800; font-size:1.1rem; }
  .rank{ color:var(--muted); width:28px; }
  .score-controls{ display:flex; gap:8px; }
  .mini-btn{
    min-width:52px; height:44px;
    border-radius:10px;
    border:1px solid #313a63;
    background:var(--panel2);
    color:var(--text);
    font-weight:800;
    font-size:.95rem;
    cursor:pointer;
  }
  .mini-btn-plus{ background:var(--green); color:#06210f; border-color:transparent; }
  .mini-btn-minus{ background:var(--red); color:#2b0505; border-color:transparent; }
  .mini-btn:active{ transform:scale(.95); }
  tr.winner-row{ background:rgba(255,204,0,.14); }
  tr.winner-row td.score{ color:var(--accent); }
  .btn-end{ background:var(--red); color:#fff; }
  .empty{ color:var(--muted); padding:14px 4px; font-size:.95rem; }
</style>
</head>
<body>
  <h1>🔔 En una nota</h1>
  <p class="sub">Panel del anfitrión</p>

  <div class="layout">
    <div style="display:flex; flex-direction:column; gap:24px;">

      <div class="panel">
        <h2>Únete a la sala</h2>
        <div class="join-box">
          <img id="qr" src="" alt="QR" />
          <div class="link-info">
            <div class="link-url" id="linkUrl">cargando…</div>
            <div class="link-hint">Cualquiera con este link puede entrar — no necesitan estar en la misma WiFi</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Ronda</h2>
        <div class="state-box">
          <div class="state-label" id="stateLabel">Esperando…</div>
          <div class="winner-banner" id="winnerBanner"></div>
        </div>
        <button class="btn btn-arm" id="armBtn">🔔 Habilitar botones</button>
        <button class="btn btn-reset" id="resetBtn">↩️ Reiniciar ronda (se equivocó)</button>
        <button class="btn btn-end" id="endBtn">🏁 Finalizar juego</button>
      </div>

    </div>

    <div class="panel">
      <h2>Marcador (solo tú lo ves) — toca +1 / −1 para dar o quitar puntos</h2>
      <table id="scoreTable">
        <thead>
          <tr><th class="rank">#</th><th>Jugador</th><th>Puntos</th><th></th></tr>
        </thead>
        <tbody id="scoreBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg">Aún no se conecta nadie…</div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const alarmEl = document.getElementById('alarm');
  let audioUnlocked = false;

  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    alarmEl.volume = 1;
    alarmEl.play().then(()=>{ alarmEl.pause(); alarmEl.currentTime = 0; }).catch(()=>{});
  }
  document.body.addEventListener('click', unlockAudio, { once:true });

  // The secret key is the last part of the URL (/host/<key>) — read it from
  // here so it never has to be hardcoded in this file.
  const HOST_KEY = window.location.pathname.split('/').filter(Boolean).pop() || '';

  socket.on('connect', () => { socket.emit('host:hello', HOST_KEY); });

  fetch('/api/info').then(r=>r.json()).then(({url}) => {
    document.getElementById('linkUrl').textContent = url;
    document.getElementById('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(url);
  }).catch(()=>{
    document.getElementById('linkUrl').textContent = 'No se pudo obtener el link, revisa la consola';
  });

  const armBtn = document.getElementById('armBtn');
  const resetBtn = document.getElementById('resetBtn');
  const endBtn = document.getElementById('endBtn');
  const stateLabel = document.getElementById('stateLabel');
  const winnerBanner = document.getElementById('winnerBanner');

  let currentWinnerId = null;
  let latestPlayers = [];

  armBtn.addEventListener('click', () => socket.emit('host:arm'));
  resetBtn.addEventListener('click', () => socket.emit('host:reset'));
  endBtn.addEventListener('click', () => {
    if(confirm('¿Finalizar el juego y mostrarle la puntuación final a todos?')){
      socket.emit('host:end');
    }
  });

  socket.on('state', (state) => {
    currentWinnerId = state.winner ? state.winner.id : null;

    if(state.phase === 'ended'){
      stateLabel.textContent = '🏁 Juego finalizado — todos están viendo la puntuación final';
      winnerBanner.textContent = '';
      armBtn.disabled = false;
    } else if(state.phase === 'locked' && state.winner){
      stateLabel.textContent = '¡Alguien tocó! Dale +1 en la tabla de abajo';
      winnerBanner.textContent = state.winner.name;
      armBtn.disabled = true;
    } else if(state.phase === 'armed'){
      stateLabel.textContent = 'Botones habilitados — esperando que alguien toque…';
      winnerBanner.textContent = '';
      armBtn.disabled = true;
    } else {
      stateLabel.textContent = `${state.playerCount || 0} jugador(es) conectados — listo para una nueva ronda`;
      winnerBanner.textContent = '';
      armBtn.disabled = false;
    }

    // Pulsa el botón de reiniciar mientras hay alguien esperando una
    // decisión — así salta a la vista si fue una falsa alarma.
    resetBtn.classList.toggle('urgent', state.phase === 'locked');

    // Re-render so the row of whoever just buzzed gets highlighted.
    renderPlayers(latestPlayers);
  });

  socket.on('buzzed', (winner) => {
    try{
      alarmEl.currentTime = 0;
      alarmEl.play().catch(()=>{});
    }catch(e){}
  });

  function renderPlayers(list){
    latestPlayers = list;
    const body = document.getElementById('scoreBody');
    const empty = document.getElementById('emptyMsg');
    body.innerHTML = '';
    if(!list.length){ empty.style.display='block'; return; }
    empty.style.display='none';
    list.forEach((p, i) => {
      const tr = document.createElement('tr');
      if(p.id === currentWinnerId) tr.classList.add('winner-row');
      tr.innerHTML = `
        <td class="rank">${i+1}</td>
        <td>${escapeHtml(p.name)}</td>
        <td class="score">${p.score}</td>
        <td>
          <div class="score-controls">
            <button class="mini-btn mini-btn-minus" data-id="${p.id}" data-delta="-1">−1</button>
            <button class="mini-btn mini-btn-plus" data-id="${p.id}" data-delta="1">+1</button>
          </div>
        </td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('.mini-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        socket.emit('host:adjust', { playerId: btn.dataset.id, delta: parseInt(btn.dataset.delta,10) });
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  socket.on('players', renderPlayers);
</script>
</body>
</html>
